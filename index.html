<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>কুকিজ প্যানেল</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
min-height:100vh;padding:8px;display:flex;justify-content:center;align-items:flex-start;
background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 50%,#a855f7 100%);
background-attachment:fixed;
color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
-webkit-font-smoothing:antialiased
}
.panel{
width:100%;max-width:340px;padding:9px;border-radius:14px;
background:rgba(255,255,255,.14);
border:1px solid rgba(255,255,255,.3);
box-shadow:0 8px 24px rgba(0,0,0,.25);
backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)
}
.row{display:flex;gap:7px;margin-bottom:7px}

.display{
flex:1;height:64px;padding:0 10px;border-radius:9px;
border:1px solid rgba(255,255,255,.28);
background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.08));
display:flex;justify-content:center;align-items:center;text-align:center;
overflow:hidden;font-size:18px;font-weight:800;letter-spacing:.4px;
color:#fff
}
.display.loading{color:rgba(255,255,255,.75);font-size:12px;font-weight:600}
.display .inner{width:100%;display:block;white-space:nowrap;overflow:hidden;text-overflow:clip}
.timer{color:#fde047;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ✅ পাশে কাউন্ট ব্যাজ */
.countBadge{
flex:none;width:56px;height:64px;border-radius:9px;
background:linear-gradient(135deg,#fbbf24,#f59e0b);
display:flex;flex-direction:column;justify-content:center;align-items:center;
color:#1f2937;font-weight:900;
box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 10px rgba(0,0,0,.15);
transition:opacity .2s
}
.countBadge.refreshing{opacity:.55}
.countNum{font-size:20px;line-height:1;font-variant-numeric:tabular-nums;display:inline-block}
.countLabel{font-size:8px;letter-spacing:.6px;margin-top:2px;opacity:.85}

/* ✅ রিপ্লেস ইফেক্ট (পেজ রিফ্রেশের মতো) */
.countNum.flip{animation:flip .45s ease}
@keyframes flip{
  0%{transform:scale(.5) rotateX(-90deg);opacity:.2}
  60%{transform:scale(1.15) rotateX(20deg);opacity:1}
  100%{transform:scale(1) rotateX(0);opacity:1}
}

.copyBtn{
width:100%;padding:11px;border:0;border-radius:9px;
background:linear-gradient(135deg,#fbbf24,#f59e0b);
color:#1f2937;font-size:12px;font-weight:800;letter-spacing:.3px;
cursor:pointer;transition:opacity .2s,transform .12s;
box-shadow:0 4px 12px rgba(251,191,36,.4)
}
.copyBtn:active:not(:disabled){transform:scale(.98)}
.copyBtn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}

.toast{
position:fixed;top:10px;left:50%;transform:translateX(-50%) translateY(-8px);
background:rgba(17,24,39,.95);border:1px solid rgba(255,255,255,.15);
padding:8px 13px;border-radius:9px;font-size:12px;font-weight:600;
color:#fff;opacity:0;transition:.25s;pointer-events:none;z-index:99
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="panel">
  <div class="row">
    <div class="display loading" id="display"><span class="inner" id="displayInner">লোড হচ্ছে...</span></div>
    <div class="countBadge" id="countBadge">
      <span class="countNum" id="countNum">--</span>
      <span class="countLabel">LEFT</span>
    </div>
  </div>
  <button class="copyBtn" id="copyBtn">COPY &amp; DELETE</button>
</div>

<script>
const URL="https://script.google.com/macros/s/AKfycbxs5UnBzGbXDsbX_I027WP7RVdGrKBuKZpYGGPEee3l6lkr670YDne_A-cwdznjFeWMhg/exec";
const SERVICE="rangeid03";
const COOLDOWN_MS=5000;

const NUMBER_KEY="kukiz_pending_number";
const LOCK_KEY="kukiz_next_allowed";

const display=document.getElementById("display");
const displayInner=document.getElementById("displayInner");
const copyBtn=document.getElementById("copyBtn");
const toast=document.getElementById("toast");
const countBadge=document.getElementById("countBadge");
const countNum=document.getElementById("countNum");

let currentNumber=localStorage.getItem(NUMBER_KEY)||"";
let nextAllowed=Number(localStorage.getItem(LOCK_KEY)||0);
let busy=false;
let timer=null;
let toastTimer=null;
let totalFetching=false;

/* ================= হেল্পার ================= */
function notify(msg){
  toast.textContent=msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.classList.remove("show"),1700);
}

function setDisplay(text,isLoading=false){
  display.classList.toggle("loading",isLoading);
  displayInner.textContent=text;
  displayInner.style.textAlign=isLoading?"center":"left";
  displayInner.scrollLeft=0;
}

function setBusy(v){
  busy=v;
  copyBtn.disabled=v||Date.now()<nextAllowed||!currentNumber;
}

/* ✅ কাউন্ট আপডেট + ফ্লিপ অ্যানিমেশন (রিপ্লেস ইফেক্ট) */
function updateCount(n){
  const val=String(n);
  if(val===countNum.textContent)return;
  countNum.textContent=val;
  countNum.classList.remove("flip");
  void countNum.offsetWidth;      // reflow → animation restart
  countNum.classList.add("flip");
}

/* ================= কাউন্ট রিফ্রেশ (পেজ রিপ্লেসের মতো) ================= */
async function loadTotal(){
  if(totalFetching)return;
  totalFetching=true;
  countBadge.classList.add("refreshing");
  try{
    // cache-buster যোগ করা হয়েছে — যাতে ব্রাউজার পুরনো কাউন্ট না ধরে
    const r=await fetch(
      URL+"?action=total&service="+encodeURIComponent(SERVICE)+"&_="+Date.now(),
      {cache:"no-store"}
    );
    const d=await r.json();
    updateCount(d.total??0);
  }catch{
    // keep previous
  }finally{
    totalFetching=false;
    countBadge.classList.remove("refreshing");
  }
}

/* ================= নাম্বার লোড ================= */
async function loadNumber(){
  if(busy||currentNumber||Date.now()<nextAllowed)return;
  setBusy(true);
  setDisplay("লোড হচ্ছে...",true);
  try{
    const r=await fetch(
      URL+"?action=get&service="+encodeURIComponent(SERVICE)+"&need=1&_="+Date.now(),
      {cache:"no-store"}
    );
    const d=await r.json();
    const numbers=d.numbers||[];
    if(!numbers.length){
      setDisplay("No Number Available",true);
      updateCount(0);
      return;
    }
    currentNumber=String(numbers[0]);
    localStorage.setItem(NUMBER_KEY,currentNumber);
    setDisplay(currentNumber,false);

    /* ✅ নাম্বার নেওয়ার পরই কাউন্ট রিফ্রেশ */
    setTimeout(loadTotal,200);
  }catch{
    setDisplay("Connection Error",true);
  }finally{
    setBusy(false);
  }
}

/* ================= টাইমার ================= */
function startTimer(){
  clearInterval(timer);
  const tick=()=>{
    const left=Math.max(0,Math.ceil((nextAllowed-Date.now())/1000));
    if(left>0){
      display.classList.remove("loading");
      displayInner.innerHTML=`<span class="timer">00:${String(left).padStart(2,"0")}</span>`;
      displayInner.style.textAlign="center";
      copyBtn.disabled=true;
    }else{
      clearInterval(timer);
      localStorage.removeItem(LOCK_KEY);
      loadTotal();
      if(!currentNumber)loadNumber();
    }
  };
  tick();
  timer=setInterval(tick,250);
}

/* ================= COPY + DELETE ================= */
copyBtn.addEventListener("click",async()=>{
  if(busy)return;
  if(Date.now()<nextAllowed){notify("Please wait 5 seconds");return;}
  if(!currentNumber){loadNumber();return;}
  setBusy(true);
  try{
    await navigator.clipboard.writeText(currentNumber);
    currentNumber="";
    localStorage.removeItem(NUMBER_KEY);
    setDisplay("",false);
    notify("Copied & Deleted");

    nextAllowed=Date.now()+COOLDOWN_MS;
    localStorage.setItem(LOCK_KEY,String(nextAllowed));
    startTimer();

    /* ✅ কপির পর সার্ভার প্রসেস হতে একটু সময় দিয়ে কাউন্ট রিফ্রেশ */
    setTimeout(loadTotal,400);
  }catch{
    notify("Copy Failed - Number Kept");
    setDisplay(currentNumber,false);
  }finally{
    setBusy(false);
  }
});

/* ================= ইনিশিয়াল ================= */
if(currentNumber){
  setDisplay(currentNumber,false);
  setBusy(false);
}else if(Date.now()<nextAllowed){
  startTimer();
}else{
  loadNumber();
}
loadTotal();
if(Date.now()<nextAllowed)startTimer();
</script>
</body>
</html>
